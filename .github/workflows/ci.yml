name: CI

# PR-time build gate — this repo had no CI at all before this. Mirrors
# deploy.yml's toolchain (node 20, pnpm 9, --no-frozen-lockfile) so the
# check exercises exactly what the deploy builds.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # vitest (jsdom) — the React islands' unit tests
      - name: Test
        run: pnpm test

      # astro check (type checking) + astro build
      - name: Build
        run: pnpm build

  # ADVISORY ON PURPOSE — never add this to a required-checks ruleset. Keeping
  # it advisory means ruleset activation never races the job's rollout.
  # Plain CLI mode, not SARIF: SARIF on a private repo needs the Code Security
  # add-on. Waivers for deliberate behavior live in .github/zizmor.yml.
  zizmor:
    name: zizmor (advisory)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Audit workflows
        run: uvx "zizmor@1.30.0" --persona=regular --config .github/zizmor.yml .github/workflows/
