name: CI

# PR-time build gate — this repo had no CI at all before this. Mirrors
# deploy.yml's toolchain (node 20, pnpm 9, --no-frozen-lockfile) so the
# check exercises exactly what the deploy builds.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # vitest (jsdom) — the React islands' unit tests
      - name: Test
        run: pnpm test

      # astro check (type checking) + astro build
      - name: Build
        run: pnpm build

  # ADVISORY ON PURPOSE — never add this to a required-checks ruleset. Keeping
  # it advisory means ruleset activation never races the job's rollout.
  # Plain CLI mode, not SARIF: SARIF on a private repo needs the Code Security
  # add-on. Waivers for deliberate behavior live in .github/zizmor.yml.
  zizmor:
    name: zizmor (advisory)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Audit workflows
        run: uvx "zizmor@1.30.0" --persona=regular --config .github/zizmor.yml .github/workflows/

  # The single required status check, for every repo in every org. Rulesets require the
  # name `gate`, so CI job names stay free to differ per repo. `if: always()` is
  # load-bearing: without it a failed dependency SKIPS this job, and a skipped required
  # check counts as passing. Advisory jobs (zizmor) stay out of `needs` so they can never
  # block. Composite: it fails unless every listed result is success or skipped.
  gate:
    needs: [build]
    if: always()
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: paris-phan/platform-actions/actions/gate@c3916228bc066b4868667e08746ef99867a57edf # 2026-09-11
        with:
          needs: ${{ toJSON(needs) }}
