# Auto-approves and auto-merges ONLY Dependabot patch updates. Everything else
# waits for a human.
#
# Three things that are easy to get wrong:
#  * The actor gate. Without it, anyone can open a PR that this workflow approves.
#  * Explicit `permissions:`. Dependabot-triggered runs get a READ-ONLY token
#    regardless of the repo default, so the write scopes must be requested here.
#  * "Allow auto-merge" must be enabled on the repo or `gh pr merge --auto` errors.
#
# The bot's own approval satisfies a 1-required-approval rule — that is the
# intended pattern, not a loophole. The repo's required checks still gate the
# merge; --auto only lands the PR once they pass — so land this only AFTER the
# checks ruleset exists, or patch updates merge unreviewed AND ungated.

name: dependabot-auto-merge

# pull_request_target is safe HERE because no PR code is ever checked out or
# executed — the job only reads Dependabot metadata and drives the gh CLI.
on: pull_request_target # zizmor: ignore[dangerous-triggers]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Gate on the PR AUTHOR, not github.actor — the actor context is spoofable
    # (a re-run makes the re-runner the actor).
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: meta
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review --approve "$PR"
          gh pr merge --auto --squash "$PR"
