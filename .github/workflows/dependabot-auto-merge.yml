# Enables auto-merge ONLY for Dependabot patch updates. Everything else waits
# for a human. Required status checks still gate the merge.
#
# The author gate is mandatory: without it, an arbitrary PR could trigger this
# workflow. "Allow auto-merge" must also remain enabled on the repository.

name: dependabot-auto-merge

# pull_request_target is safe HERE because no PR code is ever checked out or
# executed — the job only reads Dependabot metadata and drives the gh CLI.
on: pull_request_target # zizmor: ignore[dangerous-triggers]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Gate on the PR AUTHOR, not github.actor — the actor context is spoofable
    # (a re-run makes the re-runner the actor).
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: meta
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR"
