# Dependabot groups weekly patch updates. Minor and major upgrades stay
# individual so dependency, framework, and runtime migrations do not hide each
# other's failures. `cooldown` delays newly published releases.
#
# A human performs merges: GITHUB_TOKEN merges suppress push workflows and
# would bypass the deployment pipeline.
version: 2
updates:
  - package-ecosystem: npm          # covers pnpm workspaces
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    groups:
      patch:
        update-types: [patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
